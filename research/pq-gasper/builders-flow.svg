<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 404" width="1100" height="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Who carries a slot of PQ Gasper votes: the spec today vs builders aggregate</title>
<rect width="1100" height="404" rx="10" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b95a1"/></marker></defs>
<text x="15" y="60" font-size="14" font-weight="700" fill="#1d2430">Spec today</text>
<rect x="15.0" y="76" width="190" height="58" rx="8" fill="#f3f5f8" stroke="#8b95a1" stroke-width="1.4"/>
<text x="110" y="101.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">24,648 attesters</text>
<text x="110" y="118.0" text-anchor="middle" font-size="11" fill="#596372">one 2.5 KB vote each</text>
<text x="255.0" y="85.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2430">16 subnets</text>
<text x="255.0" y="99.0" text-anchor="middle" font-size="11" fill="#596372">every node on 2</text>
<line x1="211.0" y1="111.0" x2="299.0" y2="111.0" stroke="#8b95a1" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="305.0" y="76" width="190" height="58" rx="8" fill="#f3f5f8" stroke="#8b95a1" stroke-width="1.4"/>
<text x="400" y="101.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">64 aggregators</text>
<text x="400" y="118.0" text-anchor="middle" font-size="11" fill="#596372">4 per subnet × 1,540 votes</text>
<text x="552.5" y="85.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2430">16–64 proofs</text>
<text x="552.5" y="99.0" text-anchor="middle" font-size="11" fill="#596372">209 KiB each</text>
<line x1="501.0" y1="111.0" x2="604.0" y2="111.0" stroke="#8b95a1" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="610.0" y="76" width="190" height="58" rx="8" fill="#f3f5f8" stroke="#8b95a1" stroke-width="1.4"/>
<text x="705" y="101.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">next proposer</text>
<text x="705" y="118.0" text-anchor="middle" font-size="11" fill="#596372">merges 16 proofs: 0.4–1.3 s</text>
<text x="850.0" y="85.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2430">block with</text>
<text x="850.0" y="99.0" text-anchor="middle" font-size="11" fill="#596372">303 KiB proof</text>
<line x1="806.0" y1="111.0" x2="894.0" y2="111.0" stroke="#8b95a1" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="900.0" y="76" width="190" height="58" rx="8" fill="#f3f5f8" stroke="#8b95a1" stroke-width="1.4"/>
<text x="995" y="101.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">every node</text>
<text x="995" y="118.0" text-anchor="middle" font-size="11" fill="#596372">also gets the 16–64 proofs</text>
<line x1="12" y1="172" x2="1088" y2="172" stroke="#e3e6ea"/>
<text x="15" y="212" font-size="14" font-weight="700" fill="#1d2430">Builders aggregate</text>
<rect x="15.0" y="228" width="190" height="58" rx="8" fill="#f3f5f8" stroke="#8b95a1" stroke-width="1.4"/>
<text x="110" y="253.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">24,648 attesters</text>
<text x="110" y="270.0" text-anchor="middle" font-size="11" fill="#596372">one 2.5 KB vote each</text>
<text x="255.0" y="237.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2430">16 subnets</text>
<text x="255.0" y="251.0" text-anchor="middle" font-size="11" fill="#596372">big nodes only</text>
<line x1="211.0" y1="263.0" x2="299.0" y2="263.0" stroke="#8b95a1" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="305.0" y="228" width="190" height="58" rx="8" fill="#dce8f7" stroke="#2f6db5" stroke-width="1.4"/>
<text x="400" y="253.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">builders</text>
<text x="400" y="270.0" text-anchor="middle" font-size="11" fill="#596372">prove 16 subnets, then merge</text>
<text x="552.5" y="237.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2430">1 aggregate</text>
<text x="552.5" y="251.0" text-anchor="middle" font-size="11" fill="#596372">303 KiB</text>
<line x1="501.0" y1="263.0" x2="604.0" y2="263.0" stroke="#8b95a1" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="610.0" y="228" width="190" height="58" rx="8" fill="#f3f5f8" stroke="#8b95a1" stroke-width="1.4"/>
<text x="705" y="253.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">next proposer</text>
<text x="705" y="270.0" text-anchor="middle" font-size="11" fill="#596372">verifies one proof: ~13 ms</text>
<text x="850.0" y="237.0" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2430">block with</text>
<text x="850.0" y="251.0" text-anchor="middle" font-size="11" fill="#596372">303 KiB proof</text>
<line x1="806.0" y1="263.0" x2="894.0" y2="263.0" stroke="#8b95a1" stroke-width="1.6" marker-end="url(#arr)"/>
<rect x="900.0" y="228" width="190" height="58" rx="8" fill="#f3f5f8" stroke="#8b95a1" stroke-width="1.4"/>
<text x="995" y="253.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">every node</text>
<text x="995" y="270.0" text-anchor="middle" font-size="11" fill="#596372">also gets the 1 aggregate</text>
<rect x="305.0" y="318" width="190" height="52" rx="8" fill="#ffffff" stroke="#8b95a1" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="400" y="340.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2430">aggregators as backup</text>
<text x="400" y="357.0" text-anchor="middle" font-size="11" fill="#596372">publish only what adds votes</text>
<path d="M501.0,344.0 L705,344.0 L705,294" fill="none" stroke="#8b95a1" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
<text x="509.0" y="362.0" font-size="11" fill="#596372">a proposer left with k of the 16 subnets merges them and earns k/16</text>
</svg>
