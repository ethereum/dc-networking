<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Who gets a slot of PQ Gasper votes to every node, and when</title>
<rect width="1100" height="500" rx="10" fill="#ffffff"/>
<defs>
<marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker>
<marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker>
<marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f7f2f"/></marker>
</defs>
<rect x="24" y="110" width="196" height="100" rx="9" fill="#ffffff" stroke="#1d2430" stroke-width="1.5"/>
<text x="122.0" y="142" font-size="15" fill="#1d2430" font-weight="700" text-anchor="middle">Slot N</text>
<text x="122.0" y="164" font-size="12" fill="#596372" text-anchor="middle">24,648 votes, cast by 3 s</text>
<text x="122.0" y="182" font-size="12" fill="#596372" text-anchor="middle">on 16 attestation subnets</text>
<rect x="320" y="60" width="350" height="76" rx="9" fill="#eef0f3" stroke="#6b7480" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="495.0" y="86" font-size="13.5" fill="#1d2430" font-weight="700" text-anchor="middle">Regular path</text>
<text x="495.0" y="105" font-size="11.5" fill="#596372" text-anchor="middle">subnet aggregators prove, global aggregators merge</text>
<text x="495.0" y="121" font-size="11.5" fill="#596372" text-anchor="middle">open to anyone, as far as its machine allows</text>
<line x1="224" y1="160.0" x2="314" y2="98.0" stroke="#6b7480" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr-g)"/>
<line x1="676" y1="98.0" x2="794" y2="98.0" stroke="#6b7480" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-g)"/>
<text x="735.0" y="89.0" font-size="11.5" fill="#6b7480" font-weight="600" text-anchor="middle">may be late</text>
<rect x="320" y="184" width="350" height="76" rx="9" fill="#e4f0da" stroke="#3f7f2f" stroke-width="1.5"/>
<text x="495.0" y="210" font-size="13.5" fill="#1d2430" font-weight="700" text-anchor="middle">The last W proposers (say 8)</text>
<text x="495.0" y="229" font-size="11.5" fill="#596372" text-anchor="middle">each may publish, with its own proof or its builder's</text>
<text x="495.0" y="245" font-size="11.5" fill="#596372" text-anchor="middle">one honest one is enough</text>
<line x1="224" y1="160.0" x2="314" y2="222.0" stroke="#3f7f2f" stroke-width="1.6" marker-end="url(#arr-n)"/>
<line x1="676" y1="222.0" x2="794" y2="222.0" stroke="#3f7f2f" stroke-width="2" marker-end="url(#arr-n)"/>
<text x="735.0" y="213.0" font-size="11.5" fill="#3f7f2f" font-weight="600" text-anchor="middle">full or partial</text>
<rect x="800" y="28" width="276" height="264" rx="9" fill="#ffffff" stroke="#1d2430" stroke-width="1.5"/>
<text x="938.0" y="68" font-size="15" fill="#1d2430" font-weight="700" text-anchor="middle">Every node</text>
<text x="938.0" y="105" font-size="12" fill="#1d2430" text-anchor="middle">needs slot N's votes</text>
<text x="938.0" y="123" font-size="12" fill="#1d2430" text-anchor="middle">before block N+1 arrives,</text>
<text x="938.0" y="141" font-size="12" fill="#1d2430" text-anchor="middle">from someone other than</text>
<text x="938.0" y="159" font-size="12" fill="#1d2430" text-anchor="middle">its proposer.</text>
<text x="938.0" y="218" font-size="12" fill="#a3394a" font-weight="600" text-anchor="middle">Otherwise the boost of block N+1</text>
<text x="938.0" y="235" font-size="12" fill="#a3394a" font-weight="600" text-anchor="middle">is enough to orphan block N.</text>
<line x1="12" y1="312" x2="1088" y2="312" stroke="#e3e6ea"/>
<text x="24" y="338" font-size="13" fill="#1d2430" font-weight="700" text-anchor="start">When the last home node has the votes</text>
<line x1="320" y1="350" x2="320" y2="446" stroke="#e3e6ea"/>
<line x1="370" y1="350" x2="370" y2="446" stroke="#e3e6ea"/>
<line x1="420" y1="350" x2="420" y2="446" stroke="#e3e6ea"/>
<line x1="470" y1="350" x2="470" y2="446" stroke="#e3e6ea"/>
<line x1="520" y1="350" x2="520" y2="446" stroke="#e3e6ea"/>
<line x1="570" y1="350" x2="570" y2="446" stroke="#e3e6ea"/>
<line x1="620" y1="350" x2="620" y2="446" stroke="#e3e6ea"/>
<line x1="670" y1="350" x2="670" y2="446" stroke="#e3e6ea"/>
<line x1="720" y1="350" x2="720" y2="446" stroke="#e3e6ea"/>
<line x1="770" y1="350" x2="770" y2="446" stroke="#e3e6ea"/>
<line x1="820" y1="350" x2="820" y2="446" stroke="#e3e6ea"/>
<line x1="870" y1="350" x2="870" y2="446" stroke="#e3e6ea"/>
<line x1="920" y1="350" x2="920" y2="446" stroke="#e3e6ea"/>
<line x1="970" y1="350" x2="970" y2="446" stroke="#e3e6ea"/>
<line x1="1020" y1="350" x2="1020" y2="446" stroke="#e3e6ea"/>
<text x="320" y="462" font-size="12" fill="#596372" text-anchor="middle">0 s</text>
<text x="470" y="462" font-size="12" fill="#596372" text-anchor="middle">3 s</text>
<text x="620" y="462" font-size="12" fill="#596372" text-anchor="middle">6 s</text>
<text x="770" y="462" font-size="12" fill="#596372" text-anchor="middle">9 s</text>
<text x="920" y="462" font-size="12" fill="#596372" text-anchor="middle">12 s</text>
<text x="24" y="366" font-size="12.5" fill="#1d2430" font-weight="700" text-anchor="start">Regular path</text>
<rect x="680.0" y="352" width="275.0" height="18" rx="4" fill="#eef0f3"/>
<text x="817.5" y="365" font-size="11" fill="#596372" text-anchor="middle">subnet proofs at 7.2 s, merge, gossip</text>
<rect x="955.0" y="352" width="50.0" height="18" rx="4" fill="#a3394a"/>
<text x="928" y="385" font-size="12" fill="#a3394a" font-weight="600" text-anchor="start">12.7–13.7 s: too late</text>
<text x="24" y="412" font-size="12.5" fill="#1d2430" font-weight="700" text-anchor="start">Recent proposers</text>
<text x="24" y="427" font-size="11" fill="#596372" text-anchor="start">with a builder's links and servers</text>
<rect x="470.0" y="398" width="300.0" height="18" rx="4" fill="#e4f0da"/>
<text x="620.0" y="411" font-size="11" fill="#596372" text-anchor="middle">votes at 3 s, one proof, then gossip</text>
<rect x="770.0" y="398" width="70.0" height="18" rx="4" fill="#3f7f2f"/>
<text x="805.0" y="431" font-size="12" fill="#3f7f2f" font-weight="600" text-anchor="middle">9.0–10.4 s: at least 1.6 s to spare</text>
<line x1="920" y1="328" x2="920" y2="446" stroke="#a3394a" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="912" y="338" font-size="12" fill="#a3394a" font-weight="600" text-anchor="end">block N+1 arrives</text>
<text x="24" y="486" font-size="11" fill="#596372" text-anchor="start">Times from Anton Nashatyrev's simulation (1M validators) and leanVM's benchmarks.</text>
</svg>
