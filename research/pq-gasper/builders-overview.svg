<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="1100" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Who gets a slot of PQ Gasper votes to every node, and when</title>
<rect width="1100" height="500" rx="10" fill="#ffffff"/>
<defs>
<marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker>
<marker id="arr-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f6db5"/></marker>
<marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f7f2f"/></marker>
</defs>
<rect x="24" y="110" width="196" height="100" rx="9" fill="#ffffff" stroke="#1d2430" stroke-width="1.5"/>
<text x="122.0" y="142" font-size="15" fill="#1d2430" font-weight="700" text-anchor="middle">Slot N</text>
<text x="122.0" y="164" font-size="12" fill="#596372" text-anchor="middle">24,648 votes, cast by 3 s</text>
<text x="122.0" y="182" font-size="12" fill="#596372" text-anchor="middle">on 16 attestation subnets</text>
<rect x="320" y="28" width="350" height="76" rx="9" fill="#eef0f3" stroke="#6b7480" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="495.0" y="54" font-size="13.5" fill="#1d2430" font-weight="700" text-anchor="middle">Regular path</text>
<text x="495.0" y="73" font-size="11.5" fill="#596372" text-anchor="middle">subnet aggregators prove, global aggregators merge</text>
<text x="495.0" y="89" font-size="11.5" fill="#596372" text-anchor="middle">open to anyone, as far as its machine allows</text>
<line x1="224" y1="160.0" x2="314" y2="66.0" stroke="#6b7480" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr-g)"/>
<line x1="676" y1="66.0" x2="794" y2="66.0" stroke="#6b7480" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-g)"/>
<text x="735.0" y="57.0" font-size="11.5" fill="#6b7480" font-weight="600" text-anchor="middle">may be late</text>
<rect x="320" y="122" width="350" height="76" rx="9" fill="#dce8f7" stroke="#2f6db5" stroke-width="1.5"/>
<text x="495.0" y="148" font-size="13.5" fill="#1d2430" font-weight="700" text-anchor="middle">Option 1: builders</text>
<text x="495.0" y="167" font-size="11.5" fill="#596372" text-anchor="middle">sit on all 16 subnets and prove the whole slot</text>
<text x="495.0" y="183" font-size="11.5" fill="#596372" text-anchor="middle">the full aggregate goes with their offer</text>
<line x1="224" y1="160.0" x2="314" y2="160.0" stroke="#2f6db5" stroke-width="1.6" marker-end="url(#arr-b)"/>
<line x1="676" y1="160.0" x2="794" y2="160.0" stroke="#2f6db5" stroke-width="2" marker-end="url(#arr-b)"/>
<text x="735.0" y="151.0" font-size="11.5" fill="#2f6db5" font-weight="600" text-anchor="middle">a good enough view</text>
<rect x="320" y="216" width="350" height="76" rx="9" fill="#e4f0da" stroke="#3f7f2f" stroke-width="1.5"/>
<text x="495.0" y="242" font-size="13.5" fill="#1d2430" font-weight="700" text-anchor="middle">Option 2: the last W proposers (say 8)</text>
<text x="495.0" y="261" font-size="11.5" fill="#596372" text-anchor="middle">any of them that can aggregate may publish</text>
<text x="495.0" y="277" font-size="11.5" fill="#596372" text-anchor="middle">one honest one is enough</text>
<line x1="224" y1="160.0" x2="314" y2="254.0" stroke="#3f7f2f" stroke-width="1.6" marker-end="url(#arr-n)"/>
<line x1="676" y1="254.0" x2="794" y2="254.0" stroke="#3f7f2f" stroke-width="2" marker-end="url(#arr-n)"/>
<text x="735.0" y="245.0" font-size="11.5" fill="#3f7f2f" font-weight="600" text-anchor="middle">full or partial</text>
<rect x="800" y="28" width="276" height="264" rx="9" fill="#ffffff" stroke="#1d2430" stroke-width="1.5"/>
<text x="938.0" y="68" font-size="15" fill="#1d2430" font-weight="700" text-anchor="middle">Every node</text>
<text x="938.0" y="96" font-size="12" fill="#1d2430" text-anchor="middle">needs over 40 % of slot N's votes</text>
<text x="938.0" y="114" font-size="12" fill="#596372" text-anchor="middle">(7 to 10 of the 16 subnets)</text>
<text x="938.0" y="132" font-size="12" fill="#1d2430" text-anchor="middle">before block N+1 arrives,</text>
<text x="938.0" y="150" font-size="12" fill="#1d2430" text-anchor="middle">from someone other than</text>
<text x="938.0" y="168" font-size="12" fill="#1d2430" text-anchor="middle">its proposer.</text>
<text x="938.0" y="218" font-size="12" fill="#a3394a" font-weight="600" text-anchor="middle">Otherwise that proposer can leave</text>
<text x="938.0" y="235" font-size="12" fill="#a3394a" font-weight="600" text-anchor="middle">the votes out and orphan block N.</text>
<line x1="12" y1="312" x2="1088" y2="312" stroke="#e3e6ea"/>
<text x="24" y="338" font-size="13" fill="#1d2430" font-weight="700" text-anchor="start">When the last home node has the votes</text>
<line x1="320" y1="350" x2="320" y2="446" stroke="#e3e6ea"/>
<line x1="378" y1="350" x2="378" y2="446" stroke="#e3e6ea"/>
<line x1="436" y1="350" x2="436" y2="446" stroke="#e3e6ea"/>
<line x1="494" y1="350" x2="494" y2="446" stroke="#e3e6ea"/>
<line x1="552" y1="350" x2="552" y2="446" stroke="#e3e6ea"/>
<line x1="610" y1="350" x2="610" y2="446" stroke="#e3e6ea"/>
<line x1="668" y1="350" x2="668" y2="446" stroke="#e3e6ea"/>
<line x1="726" y1="350" x2="726" y2="446" stroke="#e3e6ea"/>
<line x1="784" y1="350" x2="784" y2="446" stroke="#e3e6ea"/>
<line x1="842" y1="350" x2="842" y2="446" stroke="#e3e6ea"/>
<line x1="900" y1="350" x2="900" y2="446" stroke="#e3e6ea"/>
<line x1="958" y1="350" x2="958" y2="446" stroke="#e3e6ea"/>
<line x1="1016" y1="350" x2="1016" y2="446" stroke="#e3e6ea"/>
<text x="320" y="462" font-size="12" fill="#596372" text-anchor="middle">0 s</text>
<text x="494" y="462" font-size="12" fill="#596372" text-anchor="middle">3 s</text>
<text x="668" y="462" font-size="12" fill="#596372" text-anchor="middle">6 s</text>
<text x="842" y="462" font-size="12" fill="#596372" text-anchor="middle">9 s</text>
<text x="1016" y="462" font-size="12" fill="#596372" text-anchor="middle">12 s</text>
<text x="24" y="366" font-size="12.5" fill="#1d2430" font-weight="700" text-anchor="start">Regular path</text>
<rect x="668.0" y="352" width="319.0" height="18" rx="4" fill="#eef0f3"/>
<text x="827.5" y="365" font-size="11" fill="#596372" text-anchor="middle">subnet proofs at 6 s, merge, then gossip</text>
<rect x="987.0" y="352" width="29.0" height="18" fill="#6b7480"/>
<rect x="1016.0" y="352" width="29.0" height="18" fill="#a3394a"/>
<text x="1008" y="385" font-size="12" fill="#a3394a" font-weight="600" text-anchor="end">11.5–12.5 s: too late for some</text>
<text x="24" y="412" font-size="12.5" fill="#1d2430" font-weight="700" text-anchor="start">Option 1 or 2</text>
<text x="24" y="427" font-size="11" fill="#596372" text-anchor="start">same timing, different sender</text>
<rect x="494.0" y="398" width="348.0" height="18" rx="4" fill="#e4f0da"/>
<text x="668.0" y="411" font-size="11" fill="#596372" text-anchor="middle">votes at 3 s, one proof, then gossip</text>
<rect x="842.0" y="398" width="81.2" height="18" rx="4" fill="#3f7f2f"/>
<text x="882.6" y="431" font-size="12" fill="#3f7f2f" font-weight="600" text-anchor="middle">9.0–10.4 s: at least 1.6 s to spare</text>
<line x1="1016" y1="328" x2="1016" y2="446" stroke="#a3394a" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="1008" y="338" font-size="12" fill="#a3394a" font-weight="600" text-anchor="end">block N+1 arrives</text>
<text x="24" y="486" font-size="11" fill="#596372" text-anchor="start">Times from Anton Nashatyrev's simulation (1M validators) and leanVM's benchmarks.</text>
</svg>
