<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" width="920" height="290" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The regular path delivers a slot of PQ Gasper votes by block N+2; the lightweight global topic we add delivers them by block N+1</title>
<rect width="920" height="290" rx="10" fill="#ffffff"/>
<defs>
<marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#6b7480"/></marker>
<marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto"><path d="M0,0.8 L10,5 L0,9.2 z" fill="#3f7f2f"/></marker>
</defs>
<line x1="709" y1="124.0" x2="753" y2="124.0" stroke="#6b7480" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr-g)"/>
<line x1="779" y1="124.0" x2="870" y2="124.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arr-g)"/>
<line x1="709" y1="214.0" x2="764" y2="214.0" stroke="#3f7f2f" stroke-width="1.6" marker-end="url(#arr-n)"/>
<line x1="44" y1="58" x2="44" y2="250" stroke="#aab1bb" stroke-width="1.25"/>
<text x="44" y="28" font-size="13" fill="#1d2430" font-weight="600" text-anchor="middle">votes</text>
<text x="44" y="45" font-size="12" fill="#5c6675" text-anchor="middle">3 s</text>
<line x1="766" y1="58" x2="766" y2="250" stroke="#3f7f2f" stroke-width="2"/>
<text x="766" y="28" font-size="13" fill="#1d2430" font-weight="600" text-anchor="middle">block N+1</text>
<text x="766" y="45" font-size="12" fill="#5c6675" text-anchor="middle">12 s</text>
<text x="766" y="272" font-size="12.5" fill="#3f7f2f" font-weight="600" text-anchor="middle">fork choice</text>
<line x1="872" y1="58" x2="872" y2="250" stroke="#6b7480" stroke-width="2"/>
<text x="872" y="28" font-size="13" fill="#1d2430" font-weight="600" text-anchor="middle">block N+2</text>
<text x="872" y="45" font-size="12" fill="#5c6675" text-anchor="middle">24 s</text>
<text x="872" y="272" font-size="12.5" fill="#6b7480" font-weight="600" text-anchor="middle">inclusion</text>
<circle cx="766" cy="124.0" r="10.5" fill="#ffffff" stroke="#6b7480" stroke-width="1.5"/>
<text x="766" y="129.0" font-size="14" fill="#6b7480" font-weight="700" text-anchor="middle">?</text>
<text x="76" y="89" font-size="10.5" fill="#6b7480" font-weight="700" letter-spacing="0.7" text-anchor="start">REGULAR PATH</text>
<rect x="76" y="100" width="176" height="48" rx="8" fill="#f1f3f5" stroke="#aab1bb" stroke-width="1.25"/>
<text x="164.0" y="129.0" font-size="14" fill="#1d2430" font-weight="600" text-anchor="middle">16 attestation subnets</text>
<rect x="284" y="100" width="176" height="48" rx="8" fill="#f1f3f5" stroke="#aab1bb" stroke-width="1.25"/>
<text x="372.0" y="129.0" font-size="14" fill="#1d2430" font-weight="600" text-anchor="middle">16 aggregation subnets</text>
<rect x="492" y="100" width="212" height="48" rx="8" fill="#f1f3f5" stroke="#aab1bb" stroke-width="1.25"/>
<text x="598.0" y="129.0" font-size="14" fill="#1d2430" font-weight="600" text-anchor="middle">1 global aggregation topic</text>
<line x1="44" y1="124.0" x2="70" y2="124.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arr-g)"/>
<line x1="257" y1="124.0" x2="278" y2="124.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arr-g)"/>
<line x1="465" y1="124.0" x2="486" y2="124.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arr-g)"/>
<text x="284" y="179" font-size="10.5" fill="#3f7f2f" font-weight="700" letter-spacing="0.7" text-anchor="start">WHAT WE ADD</text>
<rect x="284" y="190" width="176" height="48" rx="8" fill="#e6f2de" stroke="#3f7f2f" stroke-width="1.5"/>
<text x="372.0" y="212.0" font-size="14" fill="#1d2430" font-weight="600" text-anchor="middle">Recent proposers</text>
<text x="372.0" y="229.0" font-size="12" fill="#5c6675" text-anchor="middle">or their builders</text>
<rect x="492" y="190" width="212" height="48" rx="8" fill="#e6f2de" stroke="#3f7f2f" stroke-width="1.5"/>
<text x="598.0" y="219.0" font-size="14" fill="#1d2430" font-weight="600" text-anchor="middle">Lightweight global topic</text>
<path d="M164.0,153 V214.0 H278" fill="none" stroke="#3f7f2f" stroke-width="1.6" marker-end="url(#arr-n)"/>
<text x="155.0" y="205.0" font-size="12" fill="#3f7f2f" text-anchor="end">raw votes</text>
<line x1="465" y1="214.0" x2="486" y2="214.0" stroke="#3f7f2f" stroke-width="1.6" marker-end="url(#arr-n)"/>
</svg>
