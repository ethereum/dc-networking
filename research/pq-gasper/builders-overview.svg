<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 396" width="1100" height="396" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The regular path of PQ Gasper votes, the lightweight global topic added to it, and their deadlines</title>
<rect width="1100" height="396" rx="10" fill="#ffffff"/>
<defs>
<marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker>
<marker id="arr-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f7f2f"/></marker>
</defs>
<text x="168" y="28" font-size="12.5" fill="#6b7480" font-weight="700" text-anchor="start">Regular path</text>
<rect x="20" y="40" width="120" height="60" rx="9" fill="#ffffff" stroke="#1d2430" stroke-width="1.5"/>
<text x="80.0" y="75.0" font-size="13" fill="#1d2430" font-weight="700" text-anchor="middle">Slot N votes</text>
<rect x="168" y="40" width="180" height="60" rx="9" fill="#eef0f3" stroke="#6b7480" stroke-width="1.5"/>
<text x="258.0" y="75.0" font-size="13" fill="#1d2430" font-weight="700" text-anchor="middle">16 attestation subnets</text>
<rect x="370" y="40" width="180" height="60" rx="9" fill="#eef0f3" stroke="#6b7480" stroke-width="1.5"/>
<text x="460.0" y="75.0" font-size="13" fill="#1d2430" font-weight="700" text-anchor="middle">16 aggregation subnets</text>
<rect x="572" y="40" width="210" height="60" rx="9" fill="#eef0f3" stroke="#6b7480" stroke-width="1.5"/>
<text x="677.0" y="75.0" font-size="13" fill="#1d2430" font-weight="700" text-anchor="middle">1 global aggregation topic</text>
<line x1="144" y1="70.0" x2="162" y2="70.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arr-g)"/>
<line x1="352" y1="70.0" x2="364" y2="70.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arr-g)"/>
<line x1="554" y1="70.0" x2="566" y2="70.0" stroke="#6b7480" stroke-width="1.6" marker-end="url(#arr-g)"/>
<text x="370" y="138" font-size="12.5" fill="#3f7f2f" font-weight="700" text-anchor="start">What we add</text>
<rect x="370" y="150" width="180" height="60" rx="9" fill="#e4f0da" stroke="#3f7f2f" stroke-width="1.5"/>
<text x="460.0" y="177.0" font-size="13" fill="#1d2430" font-weight="700" text-anchor="middle">Recent proposers</text>
<text x="460.0" y="195.0" font-size="11.5" fill="#596372" text-anchor="middle">or their builders</text>
<rect x="572" y="150" width="210" height="60" rx="9" fill="#e4f0da" stroke="#3f7f2f" stroke-width="1.5"/>
<text x="677.0" y="185.0" font-size="13" fill="#1d2430" font-weight="700" text-anchor="middle">Lightweight global topic</text>
<path d="M258,104 V180.0 H364" fill="none" stroke="#3f7f2f" stroke-width="1.6" marker-end="url(#arr-n)"/>
<line x1="554" y1="180.0" x2="566" y2="180.0" stroke="#3f7f2f" stroke-width="1.6" marker-end="url(#arr-n)"/>
<rect x="860" y="40" width="220" height="170" rx="9" fill="#ffffff" stroke="#1d2430" stroke-width="1.5"/>
<text x="970.0" y="130.0" font-size="15" fill="#1d2430" font-weight="700" text-anchor="middle">Every node</text>
<line x1="786" y1="70.0" x2="854" y2="70.0" stroke="#6b7480" stroke-width="2" marker-end="url(#arr-g)"/>
<line x1="786" y1="180.0" x2="854" y2="180.0" stroke="#3f7f2f" stroke-width="2" marker-end="url(#arr-n)"/>
<line x1="12" y1="240" x2="1088" y2="240" stroke="#e3e6ea"/>
<text x="24" y="266" font-size="13" fill="#1d2430" font-weight="700" text-anchor="start">Deadlines</text>
<rect x="182.5" y="284" width="367.5" height="22" rx="4" fill="#e4f0da"/>
<line x1="550.0" y1="278" x2="550.0" y2="346" stroke="#3f7f2f" stroke-width="2.5"/>
<text x="366.2" y="299" font-size="12" fill="#3f7f2f" font-weight="600" text-anchor="middle">Lightweight topic: fork choice</text>
<rect x="182.5" y="312" width="857.5" height="22" rx="4" fill="#eef0f3"/>
<line x1="1040.0" y1="306" x2="1040.0" y2="346" stroke="#6b7480" stroke-width="2.5"/>
<text x="795.0" y="327" font-size="12" fill="#6b7480" font-weight="600" text-anchor="middle">Regular path: inclusion</text>
<line x1="60.0" y1="346" x2="1040.0" y2="346" stroke="#596372" stroke-width="1.2"/>
<line x1="60.0" y1="341" x2="60.0" y2="351" stroke="#596372" stroke-width="1.2"/>
<text x="60.0" y="367" font-size="12" fill="#1d2430" font-weight="600" text-anchor="middle">0 s</text>
<text x="60.0" y="383" font-size="11.5" fill="#596372" text-anchor="middle">block N</text>
<line x1="182.5" y1="341" x2="182.5" y2="351" stroke="#596372" stroke-width="1.2"/>
<text x="182.5" y="367" font-size="12" fill="#1d2430" font-weight="600" text-anchor="middle">3 s</text>
<text x="182.5" y="383" font-size="11.5" fill="#596372" text-anchor="middle">votes</text>
<line x1="550.0" y1="341" x2="550.0" y2="351" stroke="#596372" stroke-width="1.2"/>
<text x="550.0" y="367" font-size="12" fill="#1d2430" font-weight="600" text-anchor="middle">12 s</text>
<text x="550.0" y="383" font-size="11.5" fill="#596372" text-anchor="middle">block N+1</text>
<line x1="1040.0" y1="341" x2="1040.0" y2="351" stroke="#596372" stroke-width="1.2"/>
<text x="1040.0" y="367" font-size="12" fill="#1d2430" font-weight="600" text-anchor="middle">24 s</text>
<text x="1040.0" y="383" font-size="11.5" fill="#596372" text-anchor="middle">block N+2</text>
</svg>
