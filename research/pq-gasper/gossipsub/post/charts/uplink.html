<style>
  .chart { min-width: 0; }
  .chart svg { display: block; overflow: visible; }
  .chart text { font-size: 11px; fill: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  .chart text.lab { font-size: 12px; }
  .chart text.c1 { fill: var(--chart-1); }
  .chart text.c2 { fill: var(--chart-2); }
  .chart .base { stroke: var(--border); stroke-width: 1; }
  .chart .rule { stroke: var(--muted-foreground); stroke-width: 1; stroke-dasharray: 3 3; }
  .chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { stroke-width: 1.5; }
  .chart .c1.line, .chart .c1.dot { stroke: var(--chart-1); }
  .chart .c2.line, .chart .c2.dot { stroke: var(--chart-2); }
  .chart .c1.dot { fill: var(--chart-1); }
  .chart .c2.dot { fill: var(--chart-2); }
  .chart .dot.fail { fill: var(--background); }
</style>
<div class="ui-header">
  <p class="ui-title" style="text-wrap: balance">Home nodes fail once their mean upload reaches about half the uplink</p>
  <p class="ui-sub" style="text-wrap: pretty">Upload handed to TCP from 4 to 8 s into the slot, all traffic, as a share of the uplink, by signatures per subnet per slot. Filled: the class passed at that load. Hollow: it failed.</p>
</div>
<div class="chart" id="chart"></div>
<p class="ui-caption" id="cap" style="margin-top: 12px; text-wrap: pretty"></p>
<script>
  {
    const loads = [200, 300, 400, 600, 800, 1600]
    const series = [
      { name: 'No validators', who: 'Home nodes without validators (50/15 Mbit/s)', c: 'c1', up: [33.9, 45.9, 55.9, 71.6, 84.3, 114.9], pass: [1, 1, 0, 0, 0, 0] },
      { name: 'Stakers', who: 'home stakers (50/25 Mbit/s)', c: 'c2', up: [22.6, 31.1, 38.5, 50.1, 59.1, 85.1], pass: [1, 1, 1, 0, 0, 0] },
    ]
    const fmt = (v) => v.toLocaleString('en-US')
    const edges = series.map((s) => {
      const i = s.pass.indexOf(0)
      return s.who + ' passed at ' + Math.round(s.up[i - 1]) + ' % and failed at ' + Math.round(s.up[i]) + ' %'
    })
    document.getElementById('cap').textContent =
      'Dashed lines: half the uplink and all of it. ' + edges.join('; ') +
      '. Signatures arrive in a burst, so in the first second after publishing, nodes without validators hand TCP 126 % of their uplink even at 300, which passed. Downloads stay near half: at 1,600, 41 % (no validators) and 50 % (stakers) of 50 Mbit/s on average. 2,048 nodes, slots 2\u201319 (2\u201314 at 1,600), one seed per load.'
    const el = document.getElementById('chart')
    const draw = () => {
      const W = el.getBoundingClientRect().width
      const H = 220
      const m = { l: 0, r: 96, t: 8, b: 22 }
      const pw = W - m.l - m.r
      const ph = H - m.t - m.b
      const x = (v) => m.l + (v / 1600) * pw
      const y = (v) => m.t + ph - (v / 120) * ph
      let s = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="Mean upload as a share of the uplink against signatures per subnet per slot, for home nodes without validators and home stakers">'
      s += '<line class="base" x1="' + m.l + '" x2="' + (m.l + pw) + '" y1="' + y(0) + '" y2="' + y(0) + '"/>'
      for (const v of [50, 100]) s += '<line class="rule" x1="' + m.l + '" x2="' + (m.l + pw) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>'
      for (const v of [0, 50, 100]) s += '<text x="' + m.l + '" y="' + (y(v) - 5) + '">' + v + (v === 100 ? ' % of uplink' : ' %') + '</text>'
      for (const v of [0, 400, 800, 1200, 1600]) {
        const a = v === 0 ? 'start' : v === 1600 ? 'end' : 'middle'
        s += '<text x="' + x(v) + '" y="' + (H - 4) + '" text-anchor="' + a + '">' + fmt(v) + '</text>'
      }
      for (const se of series) {
        s += '<polyline class="line ' + se.c + '" points="' + loads.map((l, i) => x(l) + ',' + y(se.up[i])).join(' ') + '"/>'
        loads.forEach((l, i) => {
          s += '<circle class="dot ' + se.c + (se.pass[i] ? '' : ' fail') + '" cx="' + x(l) + '" cy="' + y(se.up[i]) + '" r="3.5"/>'
        })
        s += '<text class="lab ' + se.c + '" x="' + (m.l + pw + 8) + '" y="' + (y(se.up[se.up.length - 1]) + 4) + '">' + se.name + '</text>'
      }
      el.innerHTML = s + '</svg>'
    }
    draw()
    new ResizeObserver(draw).observe(el)
  }
</script>
