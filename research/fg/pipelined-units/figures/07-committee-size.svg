<g><text x="70" y="488.1" text-anchor="start" dominant-baseline="central" font-family='Nunito, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#243447">too small</text><text x="70" y="504.3" text-anchor="start" dominant-baseline="central" font-family='Nunito, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#243447">· fewer votes per bundle → little gain from</text><text x="70" y="520.5" text-anchor="start" dominant-baseline="central" font-family='Nunito, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#243447">  bundled propagation (EIP-8334)</text><text x="70" y="536.7" text-anchor="start" dominant-baseline="central" font-family='Nunito, "Avenir Next", "Segoe UI", Helvetica, Arial, sans-serif' font-size="12" fill="#243447">· more subnets and aggregators to run per unit</text></g>
<g><rect x="500" y="470" width="480" height="117.2" rx="29.3" fill="#ffffff" stroke="#e8590c" stroke-width="1"/></g>
