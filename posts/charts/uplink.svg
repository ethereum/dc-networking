<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" width="760" height="344" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Home nodes fail once their mean upload reaches about half the uplink</title>
<desc id="d">Lines of mean upload 4–8 s into the slot, as a share of the uplink, against signatures per subnet per slot (200, 300, 400, 600, 800, 1,600). Home, no validators (50/15 Mbit/s): 33.9 %, 45.9 %, 55.9 %, 71.6 %, 84.3 %, 114.9 %, passed up to 300; Home stakers (50/25 Mbit/s): 22.6 %, 31.1 %, 38.5 %, 50.1 %, 59.1 %, 85.1 %, passed up to 400.</desc>
