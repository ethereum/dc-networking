<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 468" width="760" height="468" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Home nodes incomplete in each run's worst slot, by home link and access-line loss</title>
<desc id="d">Dots on a log scale from 0.1 to 100 %: the home nodes that miss at least one of a slot's 1,600 signatures at 8.0 s, in each run's worst slot, by home link (down/up, Mbit/s) and by packet loss on the home access line. A run passes with at most 1 %. Usual packet loss, 0.05–0.25 %: 50/15 77 %, 50/25 47 %, 1,000/200 22 %, 1,000/100 21 %. A fifth of it, 0.01–0.05 %: 1,000/200 4.8 %. Loss-free home lines: 50/100 22 %, 1,000/50 3.8 %, 100/100 0.84 % and 0.61 %, 1,000/75 0.61 %, 1,000/100 0.31 %.</desc>
